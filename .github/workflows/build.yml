name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Gradle Wrapper
      run: mvn -N io.takari:maven:wrapper || gradle wrapper || npx gradle-wrapper-generator || true

    - name: Create Gradle Wrapper files manually if missing
      run: |
        if [ ! -f ./gradlew ]; then
          gradle init --type basic --automation-language groovy --dsl groov --test-framework none --project-name FruitNinjaAutoBot --non-interactive || true
        fi

    - name: Setup Gradle Wrapper
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: |
        if [ -f ./gradlew ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          gradle :app:assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
